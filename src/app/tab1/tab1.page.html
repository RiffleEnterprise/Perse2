<ion-content [fullscreen]="true" slot="fixed">
  <!-- protein viewer -->
  <div id="viewer"></div>

  <!-- loading image -->
  <img *ngIf="loading" class="loading" src="../../assets/perselogo.png" alt="Loading structure" />

  <!-- overlay UI -->
  <div id="ui">
    <div id="topbar">
      <ion-searchbar
        placeholder="Protein or PDB ID"
        color="tertiary"
        animated
        [debounce]="0"
        [(ngModel)]="searchQuery"
        (ionInput)="onSearchInput($event)"
        (search)="onSearch($event)"
        id="searchText"></ion-searchbar>

      <ion-button
        id="favorite"
        (click)="toggleFavorite()"
        color="tertiary"
        aria-label="Toggle favorite">
        <ion-icon [name]="favorite ? 'heart-sharp' : 'heart-outline'"></ion-icon>
      </ion-button>
    </div>

    <nav id="options" aria-label="Display style">
      <ion-button (click)="cartoon()" color="tertiary">Cartoon</ion-button>
      <ion-button (click)="lines()" color="tertiary">Lines</ion-button>
      <ion-button (click)="spheres()" color="tertiary">Spheres</ion-button>
      <ion-button (click)="ballsAndSticks()" color="tertiary">Balls and sticks</ion-button>
    </nav>

    <div id="navigate">
      <ion-button (click)="prevPdb()" color="tertiary" aria-label="Previous structure">&lt;</ion-button>
      <span id="counter">{{currentPdb}}/{{totalPdbs}}</span>
      <ion-button (click)="nextPdb()" color="tertiary" aria-label="Next structure">&gt;</ion-button>
    </div>

    <div id="info">
      <h1>{{structureTitle}}</h1>
      <p>{{structureDesc}}</p>
    </div>
  </div>
</ion-content>
